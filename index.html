<h1>مراجعة الكويزات – أمن الشبكات</h1>
<p class="sub">اختر الكويز من الأزرار، وأجب بنفسك أولاً ثم اضغط على «إظهار الإجابة الصحيحة» بعد أن تجيب بنفسك.</p>

<script>
const TF=["صح","خطأ"];
// [السؤال بالعربية, الأصل بالإنجليزية, الخيارات, رقم الإجابة الصحيحة, الشرح من المحاضرة, الربط للحفظ]
const D=[
["مقياس «متوسط زمن الاكتشاف» (MTTD) هو مقياس أمني.","Mean Time To Detect (MTTD) is a security metric.",TF,0,"المحاضرة 2 (مقاييس الأهداف التقنية): تشمل زمن الاستجابة للحوادث، و MTTD، و MTTR، وعدد مخالفات الامتثال.","MTTD = الزمن حتى تكتشف، وMTTR = الزمن حتى تتعافى (D للاكتشاف Detect، R للتعافي Recover)."],
["الأمن السيبراني مشكلة تقنية فقط وليس مشكلة أعمال.","Cybersecurity is only an IT issue, not a business one.",TF,1,"المحاضرة 2: الأمن السيبراني «ممكّن استراتيجي للأعمال» يحمي البيانات والعمليات وثقة العملاء.","كلمة «فقط» في الأسئلة غالباً تجعل العبارة خاطئة."],
["تحليل أثر الأعمال (BIA) يقيّم المخاطر التي تهدد أهداف العمل.","Business Impact Analysis (BIA) assesses risks to business goals.",TF,0,"المحاضرة 2 (خطوات الربط): الخطوة الثانية هي تقييم المخاطر على الأهداف (Business Impact Analysis).","BIA = أثر الأعمال، أي أي ضرر يصيب الهدف إذا وقع الخطر."],
["ما هو «التهديد» (Threat) في أمن المعلومات؟","What is a \"threat\" in information security?",["نوع من التشفير","ضابط أمني","نقطة ضعف في النظام","أي كيان يمكن أن يسبب ضرراً لأصل"],3,"المحاضرة 1: التهديد هو أي شخص أو شيء أو كيان له القدرة على إلحاق ضرر أو خسارة بأصل.","التهديد = «من أو ما يؤذي». نقطة الضعف = Vulnerability (الخيار C فخ)."],
["الثغرة (Vulnerability) هي نفسها الهجوم (Attack).","A vulnerability is the same as an attack.",TF,1,"المحاضرة 1: الثغرة ضعف أو خلل في الضوابط الأمنية، أما الهجوم فهو فعل يعرّض أمن الأصل للخطر.","الثغرة = الباب المفتوح، والهجوم = اللص الذي يدخل منه."],
["تتضمن الأهداف التقنية التعافي من الكوارث.","Technology objectives include disaster recovery.",TF,0,"المحاضرة 2: من الأهداف التقنية الشائعة التشفير، والتحكم بالوصول، والكشف والاستجابة للتهديدات، والتعافي من الكوارث والنسخ الاحتياطي.","الأهداف التقنية الأربعة: تشفير، وصول، كشف، تعافٍ."],
["التدقيق الأمني الدوري جزء من التحسين المستمر.","Regular security audits are part of continuous improvement.",TF,0,"المحاضرة 2 (الخطوة 5: المراجعة والتحسين المستمر): إجراء تدقيقات أمنية دورية، ومراقبة مؤشرات الأداء، والتكيف مع التهديدات المتطورة.","الخطوة الأخيرة في الدورة هي المراجعة، ثم تعود الدورة للبداية."],
["الأمن السيبراني يحمي من الضرر المالي فقط.","Cybersecurity only protects against financial damage.",TF,1,"المحاضرة 2: يحمي من الضرر المالي والضرر بالسمعة، ويدعم الامتثال، ويحمي العمليات وثقة العملاء.","كلمة «فقط» مرة أخرى."],
["تحدد «شهية المخاطر» (Risk Appetite) مقدار المخاطر الذي ترضى المنظمة بقبوله.","Risk appetite defines the amount of risk an organization is willing to accept.",TF,0,"المحاضرة 1: شهية المخاطر (أو تحمل المخاطر) هي مقدار المخاطر الذي ترغب المنظمة في قبوله.","الشهية = كم تتحمل، مثل شهية الأكل تماماً."],
["تحتاج المنظمات الصحية إلى الامتثال لمعيار PCI DSS.","Healthcare organizations require PCI DSS compliance.",TF,1,"المحاضرة 2: القطاع الصحي مرتبط بـ HIPAA (سرية بيانات المرضى)، أما PCI DSS فهو للمدفوعات الإلكترونية في التجارة الإلكترونية.","HIPAA = Hospital، وPCI = Payment (بطاقات الدفع)."],
["ما الفائدة الرئيسية لربط الأهداف (Mapping)؟","What is a key benefit of mapping objectives?",["زيادة التأخيرات التشغيلية","تكاليف أعلى","مرونة أعلى في مواجهة التهديدات","سياسات أكثر تعقيداً"],2,"المحاضرة 2 (فوائد الربط): عائد استثمار أفضل، وتواصل أفضل بين IT والأعمال، ومرونة أعلى ضد التهديدات.","فوائد الربط الثلاث: ROI، تواصل، مرونة. أما التأخير والتكلفة فهي نتائج سوء الربط."],
["المخاطر المتبقية (Residual Risk) هي المخاطر قبل تطبيق الضوابط.","Residual risk is the risk before controls are applied.",TF,1,"المحاضرة 1: المخاطر المتبقية هي ما يبقى من المخاطر بعد تطبيق الضوابط والإجراءات الوقائية.","Residual = «المتبقي» أي بعد الضوابط وليس قبلها."],
["أي مما يلي هدف عمل (Business Objective) في الأمن السيبراني؟","Which is a business objective in cybersecurity?",["استخدام التشفير","إعداد التحكم بالوصول","تطبيق جدران الحماية","حماية البيانات الحساسة"],3,"المحاضرة 2: «حماية البيانات الحساسة» هدف عمل، بينما التشفير والتحكم بالوصول وجدران الحماية هي أهداف تقنية (وسائل) لتحقيقه.","هدف العمل = «ماذا نريد»، والهدف التقني = «بماذا ننفذ»."],
["ماذا تضمن «الإتاحة» (Availability) في ثالوث CIA؟","What does \"availability\" in the CIA triad ensure?",["المعلومات خالية من الأخطاء","المعلومات أصلية وغير مزورة","المعلومات متاحة للمستخدمين المصرح لهم","المعلومات محمية من الإفشاء"],2,"المحاضرة 1: الإتاحة تعني أن تكون المعلومات متاحة للمستخدمين المصرح لهم دون عوائق وبالصيغة المطلوبة.","A: خالية من الأخطاء = Accuracy. B: أصلية = Authenticity. D: محمية من الإفشاء = Confidentiality."],
["ما هو «أمن العمليات» (Operations Security)؟","What is \"operations security\"?",["حماية الاتصالات","حماية الأشخاص","حماية تفاصيل العمليات","حماية الأشياء المادية"],2,"المحاضرة 1: أمن العمليات هو حماية تفاصيل عملية معينة أو سلسلة من الأنشطة.","اربط كل مجال بما يحميه: الاتصالات، الأشخاص (Personnel)، المادي (Physical)، والعمليات = تفاصيل النشاط."],
["تساعد لوحات المعلومات والتقارير (Dashboards) في سد فجوات التواصل.","Dashboards and reports help overcome communication gaps.",TF,0,"المحاضرة 2 (تجاوز فجوات التواصل): ترجمة المخاطر التقنية بلغة الأعمال، واستخدام لوحات المعلومات والتقارير، وعقد اجتماعات منتظمة بين الفريقين.","ثلاث طرق: ترجمة، لوحات، اجتماعات."],
["التأمين الذاتي (Self-Insurance) شكل من أشكال قبول المخاطر.","Self-insurance is a form of risk acceptance.",TF,0,"المحاضرة 1: «التأمين الذاتي أو قبول المخاطر» هما استراتيجية واحدة، أي الإقرار بالخطر دون محاولة تخفيفه، مع خطط استجابة وتعافٍ لتقليل الأثر.","الاسمان لشيء واحد: تتحمل الخطر بنفسك."],
["تحتاج شركات التجارة الإلكترونية إلى تأمين المدفوعات عبر الإنترنت.","E-commerce businesses need to secure online payments.",TF,0,"المحاضرة 2 (مثال التجارة الإلكترونية): الهدف تأمين المدفوعات الإلكترونية، والهدف التقني بوابة دفع متوافقة مع PCI DSS.","تجارة إلكترونية → مدفوعات → PCI DSS."],
["أي مما يلي نوع شائع من الهجمات؟","Which is a common type of attack?",["تقييم المخاطر","سياسة أمنية","هجوم حجب الخدمة (DoS)","تشفير البيانات"],2,"المحاضرة 1: من الهجمات الشائعة البرمجيات الخبيثة، وهجمات DoS التي تعطل توفر الخدمة، والتصيد، وهجوم الوسيط (MitM)، وحقن SQL.","الباقي (تقييم، سياسة، تشفير) كلها وسائل دفاع وليست هجمات."],
["يتكون ثالوث CIA من السرية والسلامة والإتاحة.","The CIA triad includes Confidentiality, Integrity, and Availability.",TF,0,"المحاضرة 1: أهداف الأمن (CIA): Confidentiality السرية، Integrity السلامة، Availability الإتاحة.","C سرية، I سلامة (عدم التلاعب)، A إتاحة."]
];
const D2=[
["يُذكر إطار «COBIT» تحديداً على أنه مفيد في:","The \"COBIT\" framework is specifically mentioned as being useful for:",["تقديم قائمة بالضوابط الأمنية الحرجة للتنفيذ التقني","إنشاء كلمات مرور قوية وإدارتها","تحديد خطوات استعادة البيانات من نسخة احتياطية معزولة","مواءمة حوكمة تقنية المعلومات مع المخاطر وأهداف العمل"],3,"المحاضرة 5 (Frameworks & Standards): COBIT مخصص لحوكمة IT ومواءمة المخاطر.","A هو CIS، وB لمدير كلمات المرور. COBIT = Governance."],
["تجزئة الشبكة (Network Segmentation) تدعم مباشرةً أي مبدأ أساسي؟","Network Segmentation directly supports which core principle?",["التحديثات الدورية للبرامج","المصادقة متعددة العوامل","سياسات كلمات المرور القوية","أقل صلاحية (Least Privilege) بالحد من الحركة الجانبية داخل الشبكة"],3,"المحاضرة 5 تدرج «Segment networks» ضمن Zero Trust وأمن الشبكات، وتقرن Least Privilege بحصر الوصول في الضروري. الخيار D هو الوحيد المرتبط منطقياً (ملاحظة: الشريحة لا تنص على الربط حرفياً).","التجزئة = غرف مقفلة، فإذا اخترق المهاجم غرفة لا ينتقل لبقية الغرف."],
["الميزة الرئيسية لأداة إدارة التحديثات المركزية مثل WSUS أو SCCM:","The main advantage of a centralized patch management tool like WSUS or SCCM is:",["تلغي الحاجة لاختبار التحديثات قبل نشرها","يمكنها تحديث أنظمة وتطبيقات غير مايكروسوفت","تكتشف ثغرات Zero-day قبل الموردين","تتيح نشراً منضبطاً ومتسقاً للتحديثات على أنظمة كثيرة"],3,"المحاضرة 5: من أفضل الممارسات استخدام أدوات مركزية (WSUS, SCCM, Intune) مع الاختبار في بيئة staging قبل النشر الواسع، فلا تلغي الاختبار.","مركزي = ضبط واتساق، وليس سحراً."],
["استخدام VPN للوصول عن بعد يوفر أماناً كاملاً حتى لو كان المستخدم على شبكة Wi-Fi عامة غير آمنة.","Using a VPN provides complete security, even on an unsecured public Wi-Fi network.",TF,1,"المحاضرة 5 (Secure Remote Access): تطلب VPN، وفي الوقت نفسه تأمين شبكات الواي فاي المنزلية والعامة وتأمين الإعدادات، فـ VPN وحده لا يكفي.","«كامل» = خطأ تقريباً دائماً؛ الأمن طبقات (Defense in Depth)."],
["الوظيفة الأساسية لأداة فحص الثغرات (Vulnerability Scanning) مقارنة باختبار الاختراق:","The core function of Vulnerability Scanning, as opposed to Penetration Testing, is to:",["اختبار الأمن المادي لمراكز البيانات","تحديد نقاط الضعف المحتملة وإبلاغ عنها تلقائياً","محاكاة هجمات الهندسة الاجتماعية على الموظفين","استغلال الثغرات فعلياً لإثبات الخطر"],1,"المحاضرة 5 تذكر الفحص الدوري للثغرات واختبار الاختراق كنشاطين منفصلين. الفحص = اكتشاف وإبلاغ، والاستغلال الفعلي (D) من عمل اختبار الاختراق.","Scan = يكتشف، Pen test = يستغل."],
["يُوصى بخدمة «Have I Been Pwned» في سياق:","\"Have I Been Pwned\" is recommended in the context of:",["اختبار زمن استعادة النسخ الاحتياطية","قائمة فحص لخطة الاستجابة للحوادث","مراقبة بيانات الاعتماد الشخصية المكشوفة في تسريبات معروفة","فحص الشبكات بحثاً عن المنافذ المفتوحة والثغرات"],2,"المحاضرة 5 (Monitor for Breaches): تُستخدم للتحقق مما إذا كانت بيانات الاعتماد مكشوفة.","Pwned = «اخترق»: هل حسابك ضمن المخترَقين؟"],
["استراتيجية النسخ الاحتياطي «المعزول» (Air-gapped) مصممة لحماية النسخ أساساً من:","An \"air-gapped\" backup strategy primarily protects backups from:",["برامج الفدية والبرمجيات الخبيثة التي تنتشر عبر الشبكة","تعطل عتاد التخزين الرئيسي","الحذف العرضي من المسؤول","الكوارث الطبيعية كالفيضانات والحرائق"],0,"المحاضرة 5 تذكر تخزين النسخ بشكل آمن (offsite/air-gapped). المقصود بالعزل عن الشبكة هو منع انتشار الفدية والبرمجيات الخبيثة إليها، أما الكوارث الطبيعية فيعالجها التخزين خارج الموقع (Offsite).","Air gap = فجوة هوائية، فلا شبكة ولا فدية."],
["يجب تفعيل خطة الاستجابة للحوادث فقط بعد تأكيد الاختراق بتحقيق جنائي رقمي.","An Incident Response Plan should only be activated after a breach is confirmed by forensic investigation.",TF,1,"المحاضرة 5 و1: الخطة موجودة مسبقاً وتحدد الأدوار والاحتواء والتعافي، والتحليل الجنائي جزء من الاستجابة نفسها وليس شرطاً قبلها.","IR = إطفاء الحريق فور الشك، وليس بعد التحقيق في سببه."],
["تخزين النسخ الاحتياطية «خارج الموقع» (Offsite) يهدف أساساً إلى تخفيف خطر:","Storing backups \"offsite\" is primarily intended to mitigate the risk of:",["موظف داخلي يحذف النسخ عمداً","تعطل عتاد مصفوفة التخزين الرئيسية","كارثة مادية (حريق أو فيضان) تدمر الأنظمة الرئيسية والنسخ المحلية معاً","فدية تشفر البيانات الرئيسية والنسخ المحلية"],2,"المحاضرة 5 توصي بتخزين النسخ offsite/air-gapped. الخارجي (Offsite) = بعد جغرافياً عن الموقع، فيحمي من الكوارث المادية. أما D فيرتبط بالعزل (Air-gapped).","Offsite = موقع آخر، فالحريق لا يصل إليه."],
["اختبار إجراءات استعادة البيانات بانتظام لا يقل أهمية عن أخذ النسخ نفسه.","Regularly testing data recovery is as important as performing the backups.",TF,0,"المحاضرة 5 (Regular Backups & Recovery): «Regularly test recovery procedures».","نسخة لم تُجرَّب = نسخة غير مضمونة."],
["التشفير غير فعال إذا حصل المهاجم على وصول مادي إلى جهاز التخزين.","Data encryption is ineffective if an attacker gains physical access to the storage device.",TF,1,"المحاضرة 5: تشفير البيانات الحساسة أينما خُزنت (data at rest)، فالتشفير يحميها حتى لو سُرق الجهاز.","التشفير عند السكون صُمم لسيناريو سرقة الجهاز."],
["وفق مبدأ أقل صلاحية (Least Privilege)، تُمنح الصلاحيات بناءً على:","According to Least Privilege, access rights are granted based on:",["تحقق لمرة واحدة عند التوظيف","العلاقة الشخصية بين المستخدم ومدير النظام","الحد الأدنى من الوصول اللازم لأداء المهمة","أقدمية الموظف في المنظمة"],2,"المحاضرة 5: «Limit user/system access to only what is necessary» مع مراجعة الصلاحيات غير المستخدمة وإلغائها.","أقل صلاحية = بقدر الحاجة فقط."],
