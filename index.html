const DATA={"lec5": [{"q": "The \"COBIT\" framework is specifically mentioned as being useful for:", "qa": "يُذكر إطار «COBIT» تحديداً على أنه مفيد في:", "o": ["Providing a list of critical security controls for technical implementation", "Creating strong passwords and managing them effectively", "Defining the steps for recovering data from an air-gapped backup", "Aligning IT governance with organizational risk and business objectives"], "oa": ["تقديم قائمة بضوابط أمنية حرجة للتنفيذ التقني", "إنشاء كلمات مرور قوية وإدارتها بفعالية", "تحديد خطوات استرجاع البيانات من نسخة احتياطية معزولة", "مواءمة حوكمة تقنية المعلومات مع المخاطر وأهداف العمل"], "c": 3, "e": "في شريحة Frameworks & Standards وُصف COBIT بأنه للحوكمة (IT governance) ومواءمتها مع المخاطر. قائمة الضوابط التقنية هي CIS وليست COBIT.", "m": "COBIT = «كوبِت» الحوكمة: يربط الـIT بالأعمال والمخاطر.", "s": "Lec5 – شريحة 22", "open": false, "tf": false}, {"q": "Network Segmentation, as a security measure, directly supports which core principle?", "qa": "يدعم تقسيم الشبكة (Network Segmentation) كإجراء أمني مباشرةً أي مبدأ أساسي؟", "o": ["Regular Software Updates", "Multi-Factor Authentication", "Strong Password Policies", "Least Privilege, by limiting lateral movement within a network"], "oa": ["التحديثات الدورية للبرمجيات", "المصادقة متعددة العوامل", "سياسات كلمات المرور القوية", "أقل الصلاحيات، بتقييد الحركة الجانبية داخل الشبكة"], "c": 3, "e": "التقسيم يحصر وصول كل مستخدم/جهاز في الجزء الذي يحتاجه فقط، فيمنع المهاجم من التنقل بين الأجزاء. في Lec5: تقسيم الشبكة مذكور مع Zero Trust (شريحة 15) ومع الوصول عن بُعد (شريحة 21)، وأقل الصلاحيات في شريحة 14 (حصر الوصول بما هو ضروري فقط). عبارة «lateral movement» غير مكتوبة حرفياً في الشرائح، لكن D هو الخيار الوحيد المرتبط بالتقسيم؛ البقية ممارسات مستقلة.", "m": "قسّم الشبكة = غرف بأبواب مقفلة؛ المهاجم لا يتنقل بينها.", "s": "Lec5 – شريحة 14, 15, 21", "open": false, "tf": false}, {"q": "The main advantage of using a centralized patch management tool like WSUS or SCCM is:", "qa": "الميزة الرئيسية لاستخدام أداة مركزية لإدارة التحديثات مثل WSUS أو SCCM هي:", "o": ["It eliminates the need for testing patches before deployment", "It can patch non-Microsoft operating systems and applications", "It automatically discovers zero-day vulnerabilities before vendors do", "It allows for controlled and consistent deployment of updates across many systems"], "oa": ["تلغي الحاجة لاختبار التحديثات قبل نشرها", "تستطيع تحديث أنظمة وتطبيقات غير مايكروسوفت", "تكتشف ثغرات اليوم الصفري تلقائياً قبل الشركات المصنِّعة", "تتيح نشراً مضبوطاً وموحداً للتحديثات على أنظمة كثيرة"], "c": 3, "e": "الشريحة 11 تذكر الأدوات المركزية (WSUS, SCCM, Intune) مع جرد البرامج واختبار التحديثات في بيئة staging قبل النشر الواسع، أي أنها لا تلغي الاختبار.", "m": "مركزي = تحكّم + اتساق.", "s": "Lec5 – شريحة 11", "open": false, "tf": false}, {"q": "Using a VPN for remote access provides complete security, even if the user is connected to an unsecured public Wi-Fi network.", "qa": "استخدام VPN للوصول عن بعد يوفر أماناً كاملاً حتى لو كان المستخدم متصلاً بشبكة Wi-Fi عامة غير آمنة.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الشريحة 21 تضع VPN كبند وتأمين شبكات الواي‑فاي المنزلية/العامة وتقسيم الشبكة والجدران النارية والإعدادات الآمنة كبنود أخرى، أي أنه جزء من منظومة وليس أماناً كاملاً.", "m": "VPN نفق وليس درعاً كاملاً.", "s": "Lec5 – شريحة 21", "open": false, "tf": true}, {"q": "The core function of a Vulnerability Scanning tool, as opposed to Penetration Testing, is to:", "qa": "الوظيفة الأساسية لأداة فحص الثغرات (Vulnerability Scanning) مقارنةً باختبار الاختراق هي:", "o": ["Test the physical security of data centers", "Automatically identify and report potential security weaknesses in systems and networks", "Simulate social engineering attacks on employees", "Actively exploit found vulnerabilities to demonstrate risk"], "oa": ["اختبار الأمن المادي لمراكز البيانات", "اكتشاف نقاط الضعف المحتملة في الأنظمة والشبكات والإبلاغ عنها تلقائياً", "محاكاة هجمات الهندسة الاجتماعية على الموظفين", "استغلال الثغرات المكتشفة فعلياً لإثبات الخطر"], "c": 1, "e": "الشريحة 19 تفصل بين «فحص الأنظمة بحثاً عن الثغرات» و«إجراء اختبار الاختراق». الفحص يكتشف ويبلّغ فقط؛ أما الاستغلال الفعلي لإظهار الخطر فهو من عمل اختبار الاختراق. (ملاحظة: الشريحة 19 تذكر الفحص واختبار الاختراق كبندين منفصلين دون تعريف؛ الفرق بينهما من المفهوم المعروف.)", "m": "Scan = يكتشف · Pentest = يخترق.", "s": "Lec5 – شريحة 19", "open": false, "tf": false}, {"q": "The \"Have I Been Pwned\" service is recommended in the context of:", "qa": "تُوصى خدمة «Have I Been Pwned» في سياق:", "o": ["Testing the recovery time of backups", "Providing a checklist for incident response planning", "Monitoring for personal credentials exposed in known data breaches", "Scanning networks for open ports and vulnerabilities"], "oa": ["اختبار زمن استرجاع النسخ الاحتياطية", "تقديم قائمة تحقق لتخطيط الاستجابة للحوادث", "مراقبة بيانات الاعتماد الشخصية المكشوفة في الاختراقات المعروفة", "فحص الشبكات بحثاً عن المنافذ المفتوحة والثغرات"], "c": 2, "e": "تحت «Monitor for Breaches» في شريحة 13: استخدم خدمات مثل Have I Been Pwned للتحقق إن كانت بيانات الدخول مكشوفة.", "m": "Pwned = «هل اتسرّق حسابي؟»", "s": "Lec5 – شريحة 13", "open": false, "tf": false}, {"q": "An \"air-gapped\" backup storage strategy is designed to protect backups primarily from:", "qa": "استراتيجية تخزين النسخ الاحتياطية «المعزولة هوائياً» (air-gapped) تهدف أساساً لحماية النسخ من:", "o": ["Ransomware and other malware that can propagate across network connections", "Hardware failure of the primary storage system", "Accidental deletion by an administrator", "Natural disasters like floods and fires"], "oa": ["برامج الفدية وغيرها من البرمجيات الخبيثة التي تنتشر عبر اتصالات الشبكة", "عطل العتاد في التخزين الرئيسي", "الحذف العرضي من قِبل المسؤول", "الكوارث الطبيعية كالفيضانات والحرائق"], "c": 0, "e": "الشريحة 17 تقول: خزّن النسخ بأمان (offsite/air-gapped). العزل الهوائي يعني عدم اتصال النسخة بالشبكة، فلا تنتقل إليها الفدية (والشريحة 10 تذكر أن الفدية تنتشر عبر البرمجيات القديمة). الكوارث تعالجها النسخة الخارجية offsite. (ملاحظة: الشريحة 17 تذكر «offsite/air-gapped» دون تعريف؛ المعنى هنا من المفهوم المعروف.)", "m": "Air gap = فجوة هواء؛ الفدية لا تعبر الهواء.", "s": "Lec5 – شريحة 17, 10", "open": false, "tf": false}, {"q": "An Incident Response Plan should only be activated after a security breach has been confirmed by a forensic investigation.", "qa": "يجب ألا تُفعَّل خطة الاستجابة للحوادث إلا بعد تأكيد الاختراق عبر تحقيق جنائي رقمي.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "شريحة 20 تطلب خطة واضحة ومجهزة مسبقاً (أدوار، اتصال، احتواء، تعافٍ) مع مراقبة مستمرة للسجلات لاكتشاف الشذوذ؛ فالخطة لا تنتظر تأكيد التحقيق الجنائي.", "m": "لا تنتظر الدخان الكامل؛ الإنذار أولاً.", "s": "Lec5 – شريحة 20", "open": false, "tf": true}, {"q": "The practice of storing backups \"offsite\" is primarily intended to mitigate the risk of:", "qa": "ممارسة تخزين النسخ الاحتياطية «خارج الموقع» (offsite) تهدف أساساً للتخفيف من خطر:", "o": ["An insider threat actor deliberately deleting backup files", "A hardware failure in the primary storage array", "A physical disaster (like a fire or flood) destroying both the primary systems and local backups", "A ransomware infection encrypting the primary data and the on-site backups"], "oa": ["قيام مهاجم من الداخل بحذف ملفات النسخ عمداً", "عطل عتادي في مصفوفة التخزين الرئيسية", "كارثة مادية (كحريق أو فيضان) تدمّر الأنظمة الرئيسية والنسخ المحلية معاً", "إصابة بالفدية تشفّر البيانات الرئيسية والنسخ داخل الموقع"], "c": 2, "e": "الشريحة 17 تجمع «offsite/air-gapped». الفكرة: نسخة في مكان آخر تنجو إذا تضرر الموقع الأصلي مادياً؛ أما الفدية فيعالجها العزل الهوائي. (ملاحظة: الشريحة تذكر offsite فقط؛ الغرض منه من المفهوم المعروف.)", "m": "Offsite = بيضك في سلّة مكان آخر.", "s": "Lec5 – شريحة 17", "open": false, "tf": false}, {"q": "Regularly testing data recovery procedures is as important as performing the backups themselves.", "qa": "اختبار إجراءات استرجاع البيانات بانتظام لا يقل أهمية عن إجراء النسخ الاحتياطية نفسها.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "شريحة 17 تضع «Regularly test recovery procedures» بجانب «Maintain frequent backups» ضمن النقاط الأساسية نفسها؛ نسخة لم تُختبر قد لا تعمل وقت الحاجة.", "m": "نسخة بلا اختبار = أمل وليست خطة.", "s": "Lec5 – شريحة 17", "open": false, "tf": true}, {"q": "Data encryption is ineffective if an attacker gains physical access to the storage device where the data resides.", "qa": "التشفير غير فعّال إذا حصل المهاجم على وصول مادي إلى جهاز التخزين الذي توجد عليه البيانات.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "شريحة 16: شفّر البيانات الحساسة أينما خُزّنت (Data at Rest) أو نُقلت، مع إدارة مفاتيح آمنة؛ فالتشفير يحمي البيانات حتى لو سُرق الجهاز، بشرط سلامة المفاتيح.", "m": "مسروق ومشفّر = صندوق مقفل بلا مفتاح.", "s": "Lec5 – شريحة 16", "open": false, "tf": true}, {"q": "According to the principle of Least Privilege, access rights should be granted based on:", "qa": "وفقاً لمبدأ أقل الصلاحيات (Least Privilege)، تُمنح حقوق الوصول بناءً على:", "o": ["A one-time verification during the hiring process", "The personal relationship between the user and the system administrator", "The minimum level of access required for a user or system to perform its function", "The seniority of the employee within the organization"], "oa": ["تحقق لمرة واحدة أثناء التوظيف", "العلاقة الشخصية بين المستخدم ومدير النظام", "الحد الأدنى من الوصول اللازم للمستخدم أو النظام لأداء وظيفته", "أقدمية الموظف داخل المؤسسة"], "c": 2, "e": "شريحة 14: حدّد وصول المستخدم/النظام بما هو ضروري فقط، واعتمد الصلاحيات حسب الدور (Role-based) وراجع الصلاحيات غير المستخدمة وألغِها دورياً.", "m": "الحد الأدنى للوظيفة: «على قد الحاجة».", "s": "Lec5 – شريحة 14", "open": false, "tf": false}, {"q": "Security awareness training is a one-time activity that should be completed during an employee’s onboarding process.", "qa": "تدريب الوعي الأمني نشاط لمرة واحدة يُنجز أثناء تهيئة الموظف عند التعيين.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "شريحة 18 تنص على تقديم «ongoing refreshers and awareness campaigns» أي تدريباً مستمراً ومتجدداً وليس مرة واحدة.", "m": "الوعي مثل النظافة: يومي لا مرة واحدة.", "s": "Lec5 – شريحة 18", "open": false, "tf": true}, {"q": "A \"SIM swapping\" attack is a method to bypass MFA by targeting which factor?", "qa": "يُعد هجوم «SIM swapping» وسيلة لتجاوز MFA عبر استهداف أي عامل؟", "o": ["Something you remember (e.g., security question)", "Something you are (e.g., fingerprint)", "Something you have (by fraudulently acquiring a victim’s phone number)", "Something you know (e.g., PIN)"], "oa": ["شيء تتذكره (مثل سؤال الأمان)", "شيء أنت عليه (مثل البصمة)", "شيء تملكه (بالاستيلاء الاحتيالي على رقم هاتف الضحية)", "شيء تعرفه (مثل PIN)"], "c": 2, "e": "شريحة 7 تذكر SIM swapping ضمن مخاطر تجاوز MFA، وشريحة 4 تصنّف الهاتف الذكي ضمن «Something you have». لذلك يستهدف الهجوم عامل «ما تملك».", "m": "SIM = شريحة بيدك = «ما تملك».", "s": "Lec5 – شريحة 4, 7", "open": false, "tf": false}, {"q": "A key objective of security monitoring and log analysis is to detect anomalies that could indicate a security incident.", "qa": "من الأهداف الرئيسية لمراقبة الأمن وتحليل السجلات اكتشاف الشذوذ الذي قد يدل على حادث أمني.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "شريحة 20: «Continuously monitor logs and detect anomalies».", "m": "السجلات = كاميرات المراقبة؛ الشذوذ = المشتبه به.", "s": "Lec5 – شريحة 20", "open": false, "tf": true}, {"q": "The \"CIS Critical Security Controls\" is a prioritized set of actions that provides a \"defense in depth\" approach to cybersecurity.", "qa": "«CIS Critical Security Controls» مجموعة إجراءات مرتَّبة حسب الأولوية تقدم نهج «الدفاع في العمق» للأمن السيبراني.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "شريحة 22 تذكر CIS Controls ضمن الأطر والمعايير. (ملاحظة: وصف «مرتّبة الأولوية/دفاع في العمق» غير مكتوب حرفياً في الشريحة، لكنه الوصف المعروف لـCIS وهو الإجابة المقصودة.)", "m": "CIS = خطوات مرتبة بالأهم أولاً.", "s": "Lec5 – شريحة 22", "open": false, "tf": true}, {"q": "The Zero Trust model assumes that threats can exist both inside and outside the traditional network perimeter.", "qa": "يفترض نموذج Zero Trust أن التهديدات قد توجد داخل المحيط التقليدي للشبكة وخارجه.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "شريحة 15: «Never assume trust, always verify» مع تقسيم الشبكة والمراقبة المستمرة؛ أي لا ثقة تلقائية حتى داخل الشبكة.", "m": "Zero Trust = لا ثقة، حتى بابن البيت.", "s": "Lec5 – شريحة 15", "open": false, "tf": true}, {"q": "In the context of Zero Trust Architecture, the principle \"never assume trust, always verify\" applies to:", "qa": "في سياق بنية Zero Trust، ينطبق مبدأ «لا تفترض الثقة أبداً، تحقق دائماً» على:", "o": ["Only initial login attempts from external networks", "Every access request, regardless of its source or destination", "Only access requests involving highly sensitive data", "Users, but not to devices or applications within the corporate network"], "oa": ["محاولات الدخول الأولية من الشبكات الخارجية فقط", "كل طلب وصول بصرف النظر عن مصدره أو وجهته", "طلبات الوصول للبيانات شديدة الحساسية فقط", "المستخدمين، دون الأجهزة أو التطبيقات داخل الشبكة"], "c": 1, "e": "شريحة 15: «Authenticate and authorize every request» أي كل طلب، دون استثناء مصدر أو وجهة.", "m": "كل طلب = بطاقة هوية.", "s": "Lec5 – شريحة 15", "open": false, "tf": false}, {"q": "The strategic purpose of conducting simulated phishing tests for employees is to:", "qa": "الغرض الاستراتيجي من إجراء اختبارات التصيّد المحاكاة للموظفين هو:", "o": ["Fulfill a requirement of the ISO/IEC 27001 standard", "Identify and punish employees who are careless with emails", "Measure and improve the organization’s resilience against real phishing attacks", "Reduce the volume of spam emails received by the company"], "oa": ["تلبية متطلب في معيار ISO/IEC 27001", "تحديد الموظفين المهملين في البريد ومعاقبتهم", "قياس مرونة المؤسسة أمام هجمات التصيّد الحقيقية وتحسينها", "تقليل حجم رسائل السبام الواردة للشركة"], "c": 2, "e": "شريحة 18 تضع الاختبارات المحاكاة ضمن التدريب والتوعية لتقوية مهارة الموظفين، وتتبعها «refreshers» مستمرة؛ الهدف تحسين المناعة لا العقاب.", "m": "تمرين حريق وهمي = جاهزية للحريق الحقيقي.", "s": "Lec5 – شريحة 18", "open": false, "tf": false}, {"q": "The primary goal of a password manager is to eliminate the need for Multi-Factor Authentication.", "qa": "الهدف الأساسي لمدير كلمات المرور هو إلغاء الحاجة إلى المصادقة متعددة العوامل.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "شريحة 13: مدير كلمات المرور يولّد كلمات فريدة ويخزنها، وبجانبه «Enable MFA» لأنه حتى لو سُرقت كلمة المرور يضيف MFA حاجزاً ثانياً. هما متكاملان.", "m": "مدير الباسوردات + MFA = قفلان لا بديل.", "s": "Lec5 – شريحة 13", "open": false, "tf": true}], "lec12": [{"q": "Mean Time To Detect (MTTD) is a security metric.", "qa": "متوسط زمن الاكتشاف (MTTD) مقياس أمني.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "شريحة «Metrics for Technology Objectives» تعدّد: زمن الاستجابة للحوادث، MTTD، MTTR، وعدد مخالفات الامتثال.", "m": "MTTD = «متى اكتشفنا؟» وMTTR = «متى تعافينا؟».", "s": "Lec2 – شريحة 16", "open": false, "tf": true}, {"q": "Cybersecurity is only an IT issue, not a business one.", "qa": "الأمن السيبراني مسألة تقنية فقط وليست مسألة أعمال.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "المحاضرة تصفه بأنه «Strategic Business Enabler» يحمي البيانات والعمليات وثقة العملاء ويجب مواءمته مع أهداف العمل.", "m": "الأمن = ممكِّن للأعمال لا قسم IT معزول.", "s": "Lec2 – شريحة 2", "open": false, "tf": true}, {"q": "Business Impact Analysis (BIA) assesses risks to business goals.", "qa": "يقيّم تحليل أثر الأعمال (BIA) المخاطر التي تهدد أهداف العمل.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "ضمن خطوات الربط: «Assess risks to those goals (Business Impact Analysis)».", "m": "BIA = كم سيخسر العمل لو وقع الخطر؟", "s": "Lec2 – شريحة 11, 18", "open": false, "tf": true}, {"q": "What is a \"threat\" in information security?", "qa": "ما هو «التهديد» (threat) في أمن المعلومات؟", "o": ["A type of encryption", "A security control", "A weakness in the system", "Any entity that can cause harm to an asset"], "oa": ["نوع من التشفير", "ضابط أمني", "نقطة ضعف في النظام", "أي كيان يمكن أن يسبب ضرراً لأصل"], "c": 3, "e": "التهديد هو أي شخص أو شيء أو كيان قد يسبب ضرراً أو خسارة لأصل. نقطة الضعف (C) اسمها Vulnerability.", "m": "Threat = من/ما يضرّ · Vulnerability = ثغرة · Control = حماية.", "s": "Lec1 – شريحة 16, 20", "open": false, "tf": false}, {"q": "A vulnerability is the same as an attack.", "qa": "الثغرة (vulnerability) هي نفسها الهجوم (attack).", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الثغرة = ضعف أو عيب في الضوابط. الهجوم = فعل متعمّد أو غير متعمّد يُخلّ بأمن الأصل (قد يستغل الثغرة).", "m": "الثغرة باب مفتوح · الهجوم دخول اللص.", "s": "Lec1 – شريحة 18, 20", "open": false, "tf": true}, {"q": "Technology objectives include disaster recovery.", "qa": "تشمل الأهداف التقنية التعافي من الكوارث.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "ضمن «Common Cybersecurity Technology Objectives»: التشفير، التحكم بالوصول، كشف التهديدات والاستجابة، والتعافي من الكوارث والنسخ الاحتياطي.", "m": "أهداف التقنية الأربعة: تشفير · وصول · كشف · تعافي.", "s": "Lec2 – شريحة 13", "open": false, "tf": true}, {"q": "Regular security audits are part of continuous improvement.", "qa": "التدقيقات الأمنية الدورية جزء من التحسين المستمر.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "الخطوة 5 «Continuous Review & Improvement» تتضمن: إجراء تدقيقات أمنية دورية، ومتابعة KPIs، والتكيّف مع التهديدات المتطورة.", "m": "التحسين المستمر = تدقيق + قياس + تكيّف.", "s": "Lec2 – شريحة 21", "open": false, "tf": true}, {"q": "Cybersecurity only protects against financial damage.", "qa": "الأمن السيبراني يحمي من الضرر المالي فقط.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "يحمي من الضرر المالي والسمعة، كما يحمي البيانات والعمليات وثقة العملاء.", "m": "مال + سمعة + بيانات + ثقة.", "s": "Lec2 – شريحة 2, 4", "open": false, "tf": true}, {"q": "Risk appetite defines the amount of risk an organization is willing to accept.", "qa": "تحدد شهية المخاطرة (Risk appetite) مقدار المخاطر الذي ترغب المؤسسة في قبوله.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "Risk Appetite (Risk Tolerance) = مقدار المخاطر الذي تقبله المؤسسة، ويؤثر على الاستثمار الأمني ويختلف باختلاف الصناعة والحجم.", "m": "الشهية = كم «أتحمل» من الخطر.", "s": "Lec1 – شريحة 21 · Lec2 – شريحة 10", "open": false, "tf": true}, {"q": "Healthcare organizations require PCI DSS compliance.", "qa": "تتطلب المنظمات الصحية الامتثال لـ PCI DSS.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "مثال القطاع الصحي في المحاضرة مرتبط بـ HIPAA (بيانات المرضى). أما PCI DSS فمرتبط بالدفع الإلكتروني (التجارة الإلكترونية).", "m": "HIPAA = صحة · PCI = بطاقات الدفع.", "s": "Lec2 – شريحة 5, 24, 25", "open": false, "tf": true}, {"q": "What is a key benefit of mapping objectives?", "qa": "ما الفائدة الرئيسية لربط (mapping) الأهداف؟", "o": ["Increased operational delays", "Higher costs", "Higher resilience against threats", "More complex policies"], "oa": ["زيادة تأخيرات التشغيل", "ارتفاع التكاليف", "مرونة أعلى في مواجهة التهديدات", "سياسات أكثر تعقيداً"], "c": 2, "e": "فوائد الربط: عائد استثمار أفضل (ROI)، تواصل أفضل بين IT والأعمال، ومرونة أعلى أمام التهديدات. بقية الخيارات هي نتائج سوء الربط.", "m": "الربط = ROI + تواصل + صمود.", "s": "Lec2 – شريحة 8", "open": false, "tf": false}, {"q": "Residual risk is the risk before controls are applied.", "qa": "المخاطر المتبقية (Residual risk) هي المخاطر قبل تطبيق الضوابط.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "Residual Risk هي المخاطر المتبقية «بعد» تطبيق الضوابط والتدابير.", "m": "Residual = الباقي بعد الحماية.", "s": "Lec1 – شريحة 21", "open": false, "tf": true}, {"q": "Which is a business objective in cybersecurity?", "qa": "أيٌّ مما يلي هدف عمل (business objective) في الأمن السيبراني؟", "o": ["Using encryption", "Configuring access control", "Implementing firewalls", "Protecting sensitive data"], "oa": ["استخدام التشفير", "ضبط التحكم بالوصول", "تنفيذ جدران الحماية", "حماية البيانات الحساسة"], "c": 3, "e": "«Protect sensitive data» أول أهداف العمل. أما التشفير والتحكم بالوصول والجدران فهي أهداف/أدوات تقنية تحقق الهدف.", "m": "الهدف = «ماذا نريد؟» · التقنية = «بماذا ننفذ؟».", "s": "Lec2 – شريحة 5, 6", "open": false, "tf": false}, {"q": "What does \"availability\" in the CIA triad ensure?", "qa": "ماذا تضمن «الإتاحة» (availability) في مثلث CIA؟", "o": ["Information is free from errors", "Information is original and genuine", "Information is accessible to authorized users", "Information is protected from disclosure"], "oa": ["المعلومات خالية من الأخطاء", "المعلومات أصلية وحقيقية", "المعلومات متاحة للمستخدمين المصرّح لهم", "المعلومات محمية من الكشف"], "c": 2, "e": "Availability = وصول المصرّحين دون عوائق. (A = Accuracy، B = Authenticity، D = Confidentiality).", "m": "Availability = «موجودة وقت الحاجة».", "s": "Lec1 – شريحة 6, 7", "open": false, "tf": false}, {"q": "What is \"operations security\"?", "qa": "ما هو «أمن العمليات» (operations security)؟", "o": ["Protecting communications", "Protecting people", "Protecting details of operations", "Protecting physical objects"], "oa": ["حماية الاتصالات", "حماية الأشخاص", "حماية تفاصيل العمليات", "حماية الأشياء المادية"], "c": 2, "e": "Operations security = حماية تفاصيل عملية معينة أو سلسلة أنشطة. (A = Communications، B = Personnel، D = Physical).", "m": "Operations = تفاصيل العملية.", "s": "Lec1 – شريحة 3, 4", "open": false, "tf": false}, {"q": "Dashboards and reports help overcome communication gaps.", "qa": "تساعد لوحات المعلومات والتقارير في سد فجوات التواصل.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "ضمن «Overcoming Communication Gaps»: ترجمة المخاطر التقنية إلى لغة الأعمال، واستخدام Dashboards وتقارير، واجتماعات دورية.", "m": "لوحة = لغة مشتركة بين IT والإدارة.", "s": "Lec2 – شريحة 28", "open": false, "tf": true}, {"q": "Self-insurance is a form of risk acceptance.", "qa": "التأمين الذاتي (Self-insurance) شكل من أشكال قبول المخاطر.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "استراتيجية «Self-Insurance or Risk Acceptance»: الإقرار بالخطر وعواقبه دون محاولة التحكم فيه، مع تقليل الأثر بخطط الاستجابة والتعافي.", "m": "Self-insurance = قبول الخطر.", "s": "Lec1 – شريحة 22, 23", "open": false, "tf": true}, {"q": "E-commerce businesses need to secure online payments.", "qa": "تحتاج أعمال التجارة الإلكترونية إلى تأمين المدفوعات عبر الإنترنت.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "مثال E-Commerce: الهدف «Secure online payments» وتقنياته بوابة دفع متوافقة مع PCI DSS.", "m": "تجارة إلكترونية = دفع آمن = PCI DSS.", "s": "Lec2 – شريحة 25", "open": false, "tf": true}, {"q": "Which is a common type of attack?", "qa": "أيٌّ مما يلي نوع شائع من الهجمات؟", "o": ["Risk assessment", "Security policy", "Denial of Service (DoS)", "Data encryption"], "oa": ["تقييم المخاطر", "سياسة أمنية", "حجب الخدمة (DoS)", "تشفير البيانات"], "c": 2, "e": "قائمة الهجمات الشائعة: البرمجيات الخبيثة، DoS، التصيّد والهندسة الاجتماعية، MitM، وحقن SQL. بقية الخيارات عمليات/ضوابط دفاعية.", "m": "DoS = يوقف الخدمة (يضرب الإتاحة).", "s": "Lec1 – شريحة 19", "open": false, "tf": false}, {"q": "The CIA triad includes Confidentiality, Integrity, and Availability.", "qa": "يشمل مثلث CIA السرية والسلامة والإتاحة.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "الشريحة المعنونة «Security Goals – CIA Triad» تعرّف Confidentiality وIntegrity وAvailability (وتضيف خصائص أخرى مثل Accuracy وAuthenticity وUtility وPossession).", "m": "C-I-A = سرية · سلامة · إتاحة.", "s": "Lec1 – شريحة 6, 7", "open": false, "tf": true}], "lec34": [{"q": "When a company introduces a telecommuting program, which firewall configuration change is most critical to support this business requirement?", "qa": "عندما تطلق شركة برنامج العمل عن بُعد، أي تغيير في إعدادات الجدار الناري هو الأهم لدعم هذا المتطلب؟", "o": ["Disabling all egress filtering for employee home IP ranges.", "Switching from stateful to stateless filtering to improve performance.", "Moving all internal databases to the DMZ for easier access.", "Adjusting rules to permit secure remote access via a Virtual Private Network (VPN) gateway."], "oa": ["تعطيل كل فلترة الخروج لنطاقات IP لمنازل الموظفين", "التحويل من الفلترة ذات الحالة إلى عديمة الحالة لتحسين الأداء", "نقل كل قواعد البيانات الداخلية إلى DMZ لتسهيل الوصول", "تعديل القواعد للسماح بوصول عن بُعد آمن عبر بوابة VPN"], "c": 3, "e": "المحاضرة تعطي هذا المثال حرفياً: عند تطبيق برنامج عمل عن بُعد تُعدَّل قواعد الجدار للسماح بالوصول للأنظمة (مثل قواعد البيانات) عبر اتصالات VPN.", "m": "عمل عن بُعد = نفق VPN.", "s": "Lec3 – شريحة 10", "open": false, "tf": false}, {"q": "A fundamental tension between usability advocates and security professionals is that usability advocates want to:", "qa": "التوتر الأساسي بين دعاة سهولة الاستخدام وخبراء الأمن أن دعاة سهولة الاستخدام يريدون:", "o": ["Implement the most complex security measures possible.", "Eliminate all security controls to maximize user satisfaction.", "Delay system deployment until perfect security is achieved.", "Make systems easy to use with minimal access procedures, while security professionals want strict access controls."], "oa": ["تطبيق أعقد الإجراءات الأمنية الممكنة", "إلغاء كل الضوابط الأمنية لزيادة رضا المستخدم", "تأجيل نشر النظام حتى يتحقق أمان مثالي", "جعل الأنظمة سهلة الاستخدام بأقل إجراءات وصول، بينما يريد خبراء الأمن ضوابط وصول صارمة"], "c": 3, "e": "الشريحة تقابل بين «Security people»: اجعل الوصول صعباً على غير المصرّح لهم بإجراءات خاصة، و«Usability advocates»: اجعل الاستخدام سهلاً دون إجراءات وصول خاصة.", "m": "الأمن = قفل · سهولة الاستخدام = باب مفتوح.", "s": "Lec4 – شريحة 9", "open": false, "tf": false}, {"q": "According to the formal definition presented, computer security ensures the confidentiality, integrity, and availability of information system assets. Which of the following is explicitly included in these assets?", "qa": "وفق التعريف الرسمي المعروض، يضمن أمن الحاسوب السرية والسلامة والإتاحة لأصول نظم المعلومات. أيٌّ مما يلي مُدرج صراحةً ضمن هذه الأصول؟", "o": ["The physical building and office supplies", "Hardware, software, firmware, and information", "Only the data stored on encrypted servers", "User satisfaction and business processes"], "oa": ["المبنى المادي والمستلزمات المكتبية", "العتاد والبرمجيات والبرمجيات الثابتة والمعلومات", "البيانات المخزنة على خوادم مشفرة فقط", "رضا المستخدم وعمليات العمل"], "c": 1, "e": "التعريف (Oxford): ضوابط تضمن CIA لأصول نظم المعلومات «including hardware, software, firmware and information being processed, stored and communicated».", "m": "أصول IS = H · S · F · I (عتاد، برمجيات، Firmware، معلومات).", "s": "Lec4 – شريحة 7", "open": false, "tf": false}, {"q": "Which firewall function involves modifying the source or destination IP address of packets to conceal the internal network structure?", "qa": "أي وظيفة في الجدار الناري تعدّل عنوان IP المصدر أو الوجهة للحزم لإخفاء هيكل الشبكة الداخلية؟", "o": ["URL Filtering", "Network Address Translation (NAT)", "Application Layer Inspection", "Intrusion Detection"], "oa": ["فلترة عناوين URL", "ترجمة عناوين الشبكة (NAT)", "فحص طبقة التطبيقات", "كشف التسلل"], "c": 1, "e": "من وظائف الجدار: «NAT to hide internal IP addresses» أي إخفاء عناوين IP الداخلية.", "m": "NAT = قناع للعناوين الداخلية.", "s": "Lec3 – شريحة 8", "open": false, "tf": false}, {"q": "A conflict between security and reliability can occur because some security controls:", "qa": "قد ينشأ تعارض بين الأمن والموثوقية لأن بعض الضوابط الأمنية:", "o": ["Increase complexity and the risk of misconfiguration, potentially leading to service disruption.", "Prioritize availability over all other security goals.", "Are inherently unreliable and fail more often than other system components.", "Simplify the environment so much that it becomes inflexible."], "oa": ["تزيد التعقيد وخطر الإعداد الخاطئ مما قد يسبب انقطاع الخدمة", "تعطي الأولوية للإتاحة على كل الأهداف الأمنية الأخرى", "غير موثوقة بطبيعتها وتفشل أكثر من باقي مكونات النظام", "تبسّط البيئة لدرجة تجعلها غير مرنة"], "c": 0, "e": "شريحة «Security with Reliability»: الموثوقية تفضّل البساطة وتقليل نقاط الفشل، وبعض الضوابط ترفع احتمال الخطأ في الإعداد (قواعد الشبكة، مزودو الهوية...) وتزيد التعقيد.", "m": "أمان أكثر = تعقيد أكثر = أخطاء إعداد أكثر.", "s": "Lec4 – شريحة 13, 14", "open": false, "tf": false}, {"q": "The Demilitarized Zone (DMZ) is specifically designed to host servers that:", "qa": "صُممت المنطقة المنزوعة السلاح (DMZ) خصيصاً لاستضافة الخوادم التي:", "o": ["Are used exclusively for internal employee file sharing and databases.", "Require high availability and interact heavily with external, untrusted networks.", "Store the organization’s most sensitive and confidential internal data.", "Do not require any firewall protection due to their hardened configuration."], "oa": ["تُستخدم حصرياً لمشاركة ملفات الموظفين وقواعد البيانات الداخلية", "تتطلب إتاحة عالية وتتفاعل بكثافة مع شبكات خارجية غير موثوقة", "تخزّن أكثر بيانات المؤسسة الداخلية حساسية وسرية", "لا تحتاج حماية جدار ناري بسبب تحصينها"], "c": 1, "e": "الـDMZ تضم خوادم البريد والويب التي تتفاعل بكثافة مع الإنترنت وهي أكثر عرضة للهجوم. أما الشبكة الداخلية (Production) فهي التي تحتاج حماية قصوى. (عبارة «high availability» غير مكتوبة حرفياً لكن B هو الخيار الصحيح الوحيد.)", "m": "DMZ = واجهة المحل الأمامية (ويب/بريد)، والمستودع خلفها.", "s": "Lec3 – شريحة 4, 5", "open": false, "tf": false}, {"q": "Which of the following is an example of a \"security-centric\" cost?", "qa": "أيٌّ مما يلي مثال على تكلفة «متمحورة حول الأمن» (security-centric)؟", "o": ["The cost of coffee in the office kitchen.", "The salary of the company’s CEO.", "Marketing expenses for a new product launch.", "Licensing for a SIEM (Security Information and Event Management) tool."], "oa": ["تكلفة القهوة في مطبخ المكتب", "راتب المدير التنفيذي للشركة", "مصاريف التسويق لإطلاق منتج جديد", "ترخيص أداة SIEM لإدارة معلومات وأحداث الأمن"], "c": 3, "e": "من مصادر التكلفة الأمنية الإضافية في المحاضرة: «Specialized observability tooling, like a SIEM»، إضافةً للجدران النارية وأدوات التصنيف والتشفير وبيئات الاختبار.", "m": "SIEM = تكلفة وُجدت لأجل الأمن فقط.", "s": "Lec4 – شريحة 15, 16", "open": false, "tf": false}, {"q": "A cultural/value conflict in security might involve a tension between:", "qa": "قد ينطوي التعارض الثقافي/القيمي في الأمن على توتر بين:", "o": ["The value of the company’s stock and the cost of its security tools.", "The age of the employees and the type of technology they prefer.", "The location of the headquarters and the geographic distribution of attacks.", "An organizational culture of transparency and a security need for confidentiality."], "oa": ["قيمة أسهم الشركة وتكلفة أدواتها الأمنية", "عمر الموظفين ونوع التقنية التي يفضلونها", "موقع المقر والتوزيع الجغرافي للهجمات", "ثقافة مؤسسية قائمة على الشفافية وحاجة أمنية للسرية"], "c": 3, "e": "شريحة «Cultural with Value Conflicts»: اختلاف القيم بين الأطراف (مثل الشفافية مقابل السرية) أو بين ثقافة المؤسسة وثقافة الأمن يخلق توتراً.", "m": "قيم: شفافية ↔ سرية.", "s": "Lec4 – شريحة 23", "open": false, "tf": false}, {"q": "According to the principles discussed, \"never compromised security to make easy to use computer systems\" means:", "qa": "وفق المبادئ المناقشة، فإن عبارة «never compromised security to make easy to use computer systems» تعني:", "o": ["Usability should be ignored during the design phase.", "Usability improvements should not come at the expense of weakening security controls.", "Security is always more important than usability, without exception.", "Easy-to-use systems are inherently insecure."], "oa": ["يجب تجاهل سهولة الاستخدام أثناء التصميم", "تحسينات سهولة الاستخدام يجب ألا تكون على حساب إضعاف الضوابط الأمنية", "الأمن دائماً أهم من سهولة الاستخدام دون استثناء", "الأنظمة سهلة الاستخدام غير آمنة بطبيعتها"], "c": 1, "e": "الشريحة تقول إن سهولة الاستخدام تعني تصميم أنظمة سهلة وكفؤة، دون التنازل عن الأمن، مع تحقيق التوازن بينهما. A وC وD مطلقة وغير مذكورة (الشريحة 12 تقول: كلاهما يجب تحقيقه).", "m": "سهّل الاستخدام، لكن لا تفتح الثغرة.", "s": "Lec4 – شريحة 11, 12", "open": false, "tf": false}, {"q": "Security components that enhance isolation, such as running separate instances, often conflict with which other business objective?", "qa": "المكونات الأمنية التي تعزز العزل، كتشغيل نسخ منفصلة، غالباً ما تتعارض مع أي هدف عمل آخر؟", "o": ["Usability, as they make the user interface more cluttered.", "Cost optimization, as they prevent co-location and reduce density.", "Governance, as they require additional approval layers.", "Innovation, as they are always based on outdated technology."], "oa": ["سهولة الاستخدام لأنها تجعل الواجهة مزدحمة", "تحسين التكلفة لأنها تمنع التواجد المشترك وتقلل الكثافة", "الحوكمة لأنها تتطلب طبقات موافقة إضافية", "الابتكار لأنها تعتمد دائماً على تقنية قديمة"], "c": 1, "e": "ضمن «Security with Business Objectives and Cost»: التقسيم للعزل يتطلب أحياناً تشغيل نسخ منفصلة، مما يمنع co-location ويقلل الكثافة فيرفع التكلفة.", "m": "عزل أكثر = موارد أكثر = تكلفة أعلى.", "s": "Lec4 – شريحة 15", "open": false, "tf": false}, {"q": "A firewall’s intrusion detection capability is designed to actively block malicious traffic in real-time, unlike its intrusion prevention capability which only generates alerts.", "qa": "قدرة الكشف عن التسلل في الجدار الناري مصممة لحجب الحركة الخبيثة فوراً، بخلاف قدرة المنع التي تكتفي بإصدار تنبيهات.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "العبارة معكوسة: الحجب والمنع يتم عبر قواعد الفلترة (intrusion prevention)، أما Intrusion Detection فهو لاكتشاف الهجمات المحتملة أو الجارية (مثل DoS) ويكمّل المنع.", "m": "Prevention = يمنع · Detection = يكتشف.", "s": "Lec3 – شريحة 7, 8", "open": false, "tf": true}, {"q": "The conflict between security and innovation primarily arises because security teams are always opposed to any form of change or new technology.", "qa": "ينشأ التعارض بين الأمن والابتكار أساساً لأن فرق الأمن تعارض دائماً أي تغيير أو تقنية جديدة.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "التعارض سببه اختلاف الأولويات: الأمن يفرض ضوابط صارمة والابتكار يحتاج حرية وسرعة (موافقات بطيئة، أدوات غير معتمدة...). والحل: استثناءات مضبوطة بدل المنع الشامل. كلمة «always» غير صحيحة.", "m": "تعارض أولويات وليس عداءً.", "s": "Lec4 – شريحة 21, 25", "open": false, "tf": true}, {"q": "An organizational culture that punishes incident reporting can encourage employees to hide security breaches.", "qa": "ثقافة مؤسسية تعاقب على الإبلاغ عن الحوادث قد تشجع الموظفين على إخفاء الاختراقات.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "من أسباب تعارض السلوك مع السياسة: «Fear of punishment – discourages incident reporting».", "m": "عقاب الإبلاغ = إخفاء.", "s": "Lec4 – شريحة 20", "open": false, "tf": true}, {"q": "A conflict of authority between IT operations and security teams can revolve around the speed and control of system changes.", "qa": "قد يدور تعارض الصلاحيات بين فرق عمليات IT والأمن حول سرعة التغييرات على الأنظمة والتحكم فيها.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "«Governance with Authority Conflicts»: خلاف حول من يملك السلطة وما التغييرات المسموحة وبأي سرعة (الأمن يريد تحكماً صارماً والعمليات تريد مرونة).", "m": "IT: السرعة · الأمن: التحكم.", "s": "Lec4 – شريحة 22", "open": false, "tf": true}, {"q": "A difference in values, such as prioritizing transparency over confidentiality, can be a source of cultural conflict in security governance.", "qa": "قد يكون اختلاف القيم، كتفضيل الشفافية على السرية، مصدراً للتعارض الثقافي في حوكمة الأمن.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "الشريحة تذكر الشفافية مقابل السرية كمثال على اختلاف القيم الذي يخلق توتراً.", "m": "شفافية ↔ سرية = تعارض قيم.", "s": "Lec4 – شريحة 23", "open": false, "tf": true}, {"q": "Usability improvements can enhance security by reducing the likelihood of errors caused by complex interfaces.", "qa": "تحسينات سهولة الاستخدام قد تعزز الأمن بتقليل احتمال الأخطاء الناتجة عن الواجهات المعقدة.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "«Make security control measures usable! It improves security by mitigating threats that arise from human errors and cognitive limitations».", "m": "أسهل = أخطاء أقل = أمان أعلى.", "s": "Lec4 – شريحة 10", "open": false, "tf": true}, {"q": "A host-based firewall’s rules can be customized to protect the system even if the corporate border firewall is compromised.", "qa": "يمكن تخصيص قواعد جدار الحماية المثبّت على الجهاز لحماية النظام حتى لو اختُرق جدار حدود الشركة.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "كل خادم ومحطة عمل يثبّت جداره الخاص بقواعد مخصصة تحميه «even when the firewall deployed to safeguard the entire organization is compromised».", "m": "دفاع بطبقات: جدار الحدود + جدار الجهاز.", "s": "Lec3 – شريحة 3", "open": false, "tf": true}, {"q": "A firewall’s state table is stored permanently and used to analyze historical attack patterns long after sessions have ended.", "qa": "جدول الحالة في الجدار الناري يُخزَّن بشكل دائم ويُستخدم لتحليل أنماط الهجمات التاريخية بعد انتهاء الجلسات بوقت طويل.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "جدول الحالة يحتفظ بمعلومات جلسات TCP واتصالات UDP النشطة لمقارنة الحزم الواردة معها (تمرير أو إسقاط). الشرائح لا تصفه كأرشيف دائم للتحليل التاريخي.", "m": "State table = الجلسات الجارية، وليس أرشيف.", "s": "Lec3 – شريحة 17, 18", "open": false, "tf": true}, {"q": "A key recommendation for balancing security and usability is to add usability features only after the core security functions of a system have been fully developed and deployed.", "qa": "من التوصيات الأساسية لتحقيق التوازن بين الأمن وسهولة الاستخدام إضافة ميزات سهولة الاستخدام فقط بعد تطوير الوظائف الأمنية الأساسية للنظام ونشرها بالكامل.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الشريحة تنص على أن متطلبات الأمن والاستخدام يجب أخذها في الاعتبار «from the very beginning of the Systems Development Project».", "m": "الأمن والاستخدام: يبدآن معاً من اليوم الأول.", "s": "Lec4 – شريحة 12", "open": false, "tf": true}, {"q": "If a company’s security policy prohibits external Telnet access, a stateless firewall rule blocking inbound TCP port 23 is a sufficient and complete implementation of this policy.", "qa": "إذا كانت سياسة الشركة تمنع الوصول الخارجي عبر Telnet، فإن قاعدة جدار ناري عديمة الحالة تحجب TCP منفذ 23 الوارد تكفي لتنفيذ هذه السياسة بشكل كامل.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "قاعدة حجب المنفذ 23 مثال حقيقي على الفلترة عديمة الحالة، لكنها ليست «كاملة»: الفلترة عديمة الحالة محدودة الفعالية (IP spoofing، لا تكشف التسلل)، ويُستخدم النوعان معاً، مع فلترة الخروج والتدقيق الدوري لمواءمة الجدار مع السياسة.", "m": "قاعدة واحدة ≠ سياسة كاملة.", "s": "Lec3 – شريحة 10, 14, 15, 18", "open": false, "tf": true}], "pol": [{"q": "In the context of the Security Policy Access Rights Matrix, developing a set of responsibilities (Ni) for each user group (si) would most likely include determining:", "qa": "في سياق مصفوفة حقوق الوصول لسياسة الأمن، فإن تطوير مجموعة المسؤوليات (Ni) لكل مجموعة مستخدمين (si) يتضمن غالباً تحديد:", "o": ["The brand of firewall to be used by that group.", "The vacation schedule for group members.", "The specific model of laptops allocated to the group.", "Who within that group is authorized to release data or call law enforcement during an incident."], "oa": ["ماركة الجدار الناري التي تستخدمها المجموعة", "جدول إجازات أعضاء المجموعة", "طراز الحواسيب المحمولة المخصصة للمجموعة", "من داخل المجموعة مخوّل بإفشاء البيانات أو استدعاء جهات إنفاذ القانون أثناء الحادث"], "c": 3, "e": "Ni = مسؤوليات كل مجموعة تجاه الأمن (من يتصرف، من يتحدث للإعلام، من يبلّغ الجهات الأمنية). الماركات والإجازات والأجهزة ليست من مسؤوليات السياسة.", "m": "Ni = «من يفعل ماذا وقت الحادث».", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "The physical security of resources includes protecting the confidentiality of data transmitted over network cabling from eavesdropping.", "qa": "يشمل الأمن المادي للموارد حماية سرية البيانات المنقولة عبر كابلات الشبكة من التنصت.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "السؤال 10 في الاختبار نفسه يؤكد أن تأمين مسار الكابلات ضد التنصت جزء من «Physical Security of Resources».", "m": "الكابل أيضاً أصل مادي يجب حمايته.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "A policy is judged to have \"Quality\" if it:", "qa": "تُعد السياسة ذات «جودة» (Quality) إذا:", "o": ["Is written in a language that all employees can understand.", "Addresses all relevant industry issues and is specific enough to be effective.", "Is implemented uniformly across all company branches.", "Uses the most advanced technological terminology available."], "oa": ["كُتبت بلغة يفهمها كل الموظفين", "عالجت كل القضايا المهمة في الصناعة وكانت محددة بما يكفي لتكون فعّالة", "طُبّقت بشكل موحد في كل فروع الشركة", "استخدمت أحدث المصطلحات التقنية المتاحة"], "c": 1, "e": "الجودة تتعلق بمحتوى السياسة: ملاءمتها لقضايا الصناعة ودقتها. التطبيق الموحد (C) هو Conformity.", "m": "Quality = محتوى مناسب ومحدد.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "The document states that security policies are \"useless\" if they are applied to an industry where they are ineffective. This highlights the importance of:", "qa": "يذكر المستند أن سياسات الأمن «عديمة الفائدة» إذا طُبقت في صناعة لا تكون فعالة فيها. وهذا يبرز أهمية:", "o": ["Benchmarking and tailoring policies to the specific industry context.", "Making policies as strict as possible regardless of the industry.", "Hiring security consultants from different industries.", "Automating all policy enforcement."], "oa": ["المقارنة المرجعية وتكييف السياسات مع سياق الصناعة المحددة", "جعل السياسات أشد صرامة بصرف النظر عن الصناعة", "توظيف مستشاري أمن من صناعات مختلفة", "أتمتة كل تطبيق السياسات"], "c": 0, "e": "الفكرة: السياسة تُفصَّل على الصناعة (Benchmarking) وليست قالباً واحداً للجميع، وهذا هو معنى Quality.", "m": "كل صناعة تحتاج «مقاساً» خاصاً.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "Logical access restriction is considered complete if it only implements preventive controls like passwords.", "qa": "يُعد تقييد الوصول المنطقي مكتملاً إذا اكتفى بتطبيق ضوابط وقائية مثل كلمات المرور.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "السؤال 17 ينص على أنه يشمل ضوابط وقائية «وكاشفة» معاً، فالاكتفاء بالوقائية ناقص.", "m": "وقاية + كشف = تقييد كامل.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "What is the implied purpose of the \"Reflection\" phase in a comprehensive security cycle?", "qa": "ما الغرض الضمني لمرحلة «التأمل» (Reflection) في دورة أمنية شاملة؟", "o": ["To prevent an attack from occurring.", "To physically inspect hardware for tampering.", "To analyze an incident after it has occurred to improve future policies and responses.", "To detect an ongoing intrusion."], "oa": ["منع وقوع الهجوم", "فحص العتاد ماديّاً بحثاً عن العبث", "تحليل الحادث بعد وقوعه لتحسين السياسات والاستجابات المستقبلية", "اكتشاف تسلل جارٍ"], "c": 2, "e": "من صياغة الأسئلة ومفتاح Quiz_2: المراحل تشمل Detection وReaction وReflection (والمنع Prevention). وReflection هي مرحلة التعلم من الحادث بعد وقوعه لتحسين السياسات والاستجابة.", "m": "Reflection = مراجعة ما بعد الحادث (مرآة).", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "The \"Comprehensiveness\" of a security policy requires that it addresses all phases of security. Which of the following is a distinct phase mentioned in the lecture?", "qa": "تتطلب «الشمولية» (Comprehensiveness) في سياسة الأمن أن تغطي كل مراحل الأمن. أيٌّ مما يلي مرحلة مستقلة ذُكرت في المحاضرة؟", "o": ["Encryption", "Budgeting", "Prosecution", "Reflection"], "oa": ["التشفير", "الميزانية", "الملاحقة القضائية", "التأمل (Reflection)"], "c": 3, "e": "مفتاح Quiz_2: Reflection هي المرحلة المذكورة. أما Encryption فأداة، وBudgeting وProsecution ليستا من مراحل الأمان.", "m": "المراحل الأربع تبدأ بـ P-D-R-R.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "The primary purpose of a Security Policy Access Rights Matrix (M = {S, R}) is to:", "qa": "الغرض الأساسي لمصفوفة حقوق الوصول لسياسة الأمن (M = {S, R}) هو:", "o": ["Document the IP addresses of all network hosts and servers.", "Formally define the relationship between user groups (S) and system resources (R) to guide policy creation.", "Serve as a network topology map for technicians.", "List the contact information for all department heads."], "oa": ["توثيق عناوين IP لكل المضيفين والخوادم", "تحديد العلاقة رسمياً بين مجموعات المستخدمين (S) وموارد النظام (R) لتوجيه صياغة السياسة", "العمل كخريطة طوبولوجيا للشبكة للفنيين", "سرد بيانات التواصل لرؤساء الأقسام"], "c": 1, "e": "M = {S, R}: S مجموعات المستخدمين وR الموارد؛ المصفوفة تربط من يصل إلى ماذا وتُبنى عليها السياسة.", "m": "S = من · R = ماذا · M = العلاقة بينهما.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "Security policies are static documents that do not require change once implemented.", "qa": "سياسات الأمن وثائق ثابتة لا تحتاج إلى تغيير بعد تطبيقها.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "السياسة تتغير مع التهديدات والأعمال؛ ومرحلة Reflection تعني تحسينها بعد كل حادث.", "m": "السياسة كائن حي.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "The lecture emphasizes that safeguarding the physical path of cabling against eavesdropping is part of:", "qa": "تؤكد المحاضرة أن حماية المسار المادي للكابلات من التنصت جزء من:", "o": ["Logical Access Restriction", "Security Requirements Specification", "Incident Handling Procedures", "Physical Security of Resources"], "oa": ["تقييد الوصول المنطقي", "مواصفات المتطلبات الأمنية", "إجراءات التعامل مع الحوادث", "الأمن المادي للموارد"], "c": 3, "e": "الكابل عنصر مادي، فحمايته من التنصت من الأمن المادي للموارد وليس من الوصول المنطقي.", "m": "كابل = مادي.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "Detective controls, such as intrusion detection systems, are designed to completely prevent unauthorized access attempts.", "qa": "الضوابط الكاشفة، مثل أنظمة كشف التسلل، مصممة لمنع محاولات الوصول غير المصرّح بها منعاً تاماً.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الضوابط الكاشفة ترصد وتسجل وتبلّغ، أما المنع فمن عمل الضوابط الوقائية.", "m": "Detective = يكشف · Preventive = يمنع.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "If a security policy is found to be non-compliant in certain departments but strictly followed in others, this directly indicates a failure in which area of policy effectiveness?", "qa": "إذا وُجدت سياسة أمنية غير ملتزم بها في بعض الأقسام ومطبقة بصرامة في أخرى، فهذا يدل مباشرة على إخفاق في أي جانب من فعالية السياسة؟", "o": ["Conformity", "Specification", "Quality", "Comprehensiveness"], "oa": ["الالتزام (Conformity)", "التوصيف (Specification)", "الجودة (Quality)", "الشمولية (Comprehensiveness)"], "c": 0, "e": "Conformity = كيف تُفسَّر السياسة وتُنفَّذ وتُتبع عبر المؤسسة (السؤال 16). التفاوت بين الأقسام = ضعف التزام.", "m": "Conformity = «هل الكل ملتزم؟»", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "A Security Policy Access Rights Matrix is primarily used to calculate the financial cost of each system resource.", "qa": "تُستخدم مصفوفة حقوق الوصول أساساً لحساب التكلفة المالية لكل مورد في النظام.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "وظيفتها ربط المجموعات بالموارد (S و R) لتوجيه صياغة السياسة وليست أداة تكلفة.", "m": "مصفوفة صلاحيات، لا محاسبة.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "The set 'R' in the access rights matrix includes both tangible items like routers and intangible items like \"remote access.\"", "qa": "تشمل المجموعة 'R' في مصفوفة حقوق الوصول عناصر ملموسة كالموجهات وغير ملموسة مثل «الوصول عن بُعد».", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "R = موارد النظام بالمعنى الواسع: أجهزة (Routers) وخدمات/قدرات (Remote Access).", "m": "R = كل ما يُحمى: شيء أو خدمة.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "The responsibility for \"who talks to the press\" during a security incident should be a defined element of a user group’s responsibilities (Ni) in the security policy.", "qa": "يجب أن تكون مسؤولية «من يتحدث للصحافة» أثناء الحادث الأمني عنصراً محدداً ضمن مسؤوليات (Ni) مجموعة المستخدمين في سياسة الأمن.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "مثال مباشر على Ni: تحديد من يملك صلاحية التواصل الإعلامي أو إفشاء البيانات أو الاتصال بالجهات الأمنية.", "m": "الإعلام ضمن Ni.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "The concept of \"Conformity,\" when measuring the effectiveness of security policies, is primarily concerned with:", "qa": "ينصب مفهوم «الالتزام» (Conformity) عند قياس فعالية سياسات الأمن أساساً على:", "o": ["The technical sophistication of the security tools deployed.", "Whether the policies cover all known sources of threats.", "How the policies are interpreted, implemented, and followed across the organization.", "The specificity and applicability of the policies to the industry."], "oa": ["التعقيد التقني للأدوات الأمنية المنشورة", "هل تغطي السياسات كل مصادر التهديد المعروفة", "كيف تُفسَّر السياسات وتُنفَّذ وتُتبع عبر المؤسسة", "خصوصية السياسات وقابليتها للتطبيق على الصناعة"], "c": 2, "e": "B = Comprehensiveness، D = Quality، أما Conformity فهي التفسير والتنفيذ والالتزام.", "m": "Comprehensiveness شامل · Quality جيد · Conformity ملتزَم.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "According to the lecture, \"Logical access restriction\" involves both preventive and detective controls. A \"detective control\" is best described as:", "qa": "وفق المحاضرة، يشمل «تقييد الوصول المنطقي» ضوابط وقائية وكاشفة. يوصف «الضابط الكاشف» على أفضل وجه بأنه:", "o": ["A system that logs and reports user activities for review and action.", "A firewall that blocks unauthorized network traffic at the perimeter.", "A mechanism like a password that uniquely identifies an authorized user.", "A biometric scanner that prevents physical entry."], "oa": ["نظام يسجل أنشطة المستخدمين ويبلّغ عنها للمراجعة واتخاذ إجراء", "جدار ناري يحجب الحركة غير المصرّح بها عند المحيط", "آلية مثل كلمة المرور تحدد هوية المستخدم المصرّح", "ماسح بيومتري يمنع الدخول المادي"], "c": 0, "e": "الكاشف يرصد ويسجل ويبلّغ. B وC وD ضوابط وقائية تمنع أو تتحقق من الهوية.", "m": "Detective = كاميرا · Preventive = قفل.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": false}, {"q": "A policy can be comprehensive even if it fails to address one of the phases like \"detection\" or \"reaction.\"", "qa": "يمكن أن تكون السياسة شاملة حتى لو أهملت إحدى المراحل مثل «الكشف» أو «الاستجابة».", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الشمولية تعني تغطية كل مراحل الأمن، وإهمال مرحلة يهدم الشمولية.", "m": "ناقص مرحلة = ليست شاملة.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "The \"Quality\" of a security policy is determined solely by its length and the number of rules it contains.", "qa": "تُحدَّد «جودة» سياسة الأمن بطولها وعدد قواعدها فقط.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الجودة = معالجة قضايا الصناعة المهمة مع دقة كافية للفعالية، لا بالطول أو بعدد القواعد.", "m": "الكيف لا الكم.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}, {"q": "Conformity measures whether a policy is effective in all areas of the organization, not just some.", "qa": "يقيس الالتزام (Conformity) ما إذا كانت السياسة فعالة في كل مجالات المؤسسة وليس بعضها فقط.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "مرتبطة بالسؤال 12: Conformity هي اتساق التفسير والتطبيق عبر المؤسسة كلها.", "m": "Conformity = الكل ملتزم.", "s": "مفتاح الإجابات: Quiz_2.pdf (الموضوع خارج الشباتر)", "open": false, "tf": true}], "hw": [{"q": "In secure key management for encryption, a fundamental best practice is to:", "qa": "في إدارة مفاتيح التشفير الآمنة، من أساسيات الممارسة الجيدة:", "o": ["Use a key management service or system to securely generate, store, and rotate keys", "Use the same strong key for all encrypted databases to simplify management", "Embed encryption keys directly within the application source code", "Store encryption keys in the same database as the encrypted data for quick access"], "oa": ["استخدام خدمة/نظام لإدارة المفاتيح لتوليدها وتخزينها وتدويرها بأمان", "استخدام مفتاح قوي واحد لكل قواعد البيانات المشفرة لتبسيط الإدارة", "تضمين المفاتيح داخل الشيفرة المصدرية للتطبيق", "تخزين المفاتيح في نفس قاعدة بيانات البيانات المشفرة لسرعة الوصول"], "c": 0, "e": "الشريحة: «Implement secure key management». باقي الخيارات تُفقد التشفير فائدته.", "m": "المفتاح لا يُحفظ بجانب القفل.", "s": "Lec5 – شريحة 16", "open": false, "tf": false}, {"q": "Encryption of data at rest is only necessary for data stored on portable devices like laptops and USB drives.", "qa": "تشفير البيانات المخزنة (at rest) ضروري فقط للبيانات على الأجهزة المحمولة كالحواسيب المحمولة ومحركات USB.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الشريحة: شفّر البيانات الحساسة «wherever stored or transmitted» أي في أي مكان تُخزَّن فيه.", "m": "at rest = أينما خُزّنت.", "s": "Lec5 – شريحة 16", "open": false, "tf": true}, {"q": "The primary security risk of not maintaining a software inventory for patch management is:", "qa": "الخطر الأمني الرئيسي لعدم الاحتفاظ بجرد للبرمجيات في إدارة التحديثات هو:", "o": ["Increased software licensing costs", "Incompatibility between different operating systems", "Violating open-source software licenses", "The inability to identify and patch vulnerable systems, leaving them exposed to exploitation"], "oa": ["ارتفاع تكاليف تراخيص البرمجيات", "عدم التوافق بين أنظمة التشغيل المختلفة", "مخالفة تراخيص البرمجيات مفتوحة المصدر", "عدم القدرة على تحديد الأنظمة الضعيفة وتحديثها فتبقى عرضة للاستغلال"], "c": 3, "e": "الشريحة تطلب «Maintain an inventory of all software and versions» وتحذر من استغلال الثغرات المعروفة في الأنظمة غير المحدثة.", "m": "ما لا تعرفه لا تستطيع ترقيعه.", "s": "Lec5 – شريحة 10, 11", "open": false, "tf": false}, {"q": "A key difference between using an app-based authenticator and SMS for MFA is that app-based authenticators are generally:", "qa": "الفرق الرئيسي بين تطبيق المصادقة ورسائل SMS في MFA أن تطبيقات المصادقة عموماً:", "o": ["Less expensive for the organization to implement", "More secure as they are less vulnerable to SIM swapping attacks", "Required by the PCI-DSS compliance standard", "More convenient as they do not require a smartphone"], "oa": ["أقل تكلفة على المؤسسة", "أكثر أماناً لأنها أقل عرضة لهجمات SIM swapping", "مطلوبة بموجب معيار PCI-DSS", "أكثر راحة لأنها لا تحتاج هاتفاً ذكياً"], "c": 1, "e": "الشريحة 8 توصي بتطبيقات المصادقة بدلاً من SMS، والشريحة 7 تذكر SIM swapping كخطر لتجاوز MFA.", "m": "التطبيق ≠ رقم هاتف يُسرق.", "s": "Lec5 – شريحة 7, 8", "open": false, "tf": false}, {"q": "The WannaCry ransomware attack is cited as an example that exploited:", "qa": "يُذكر هجوم الفدية WannaCry كمثال استغل:", "o": ["Unpatched vulnerabilities in Windows operating systems", "A previously unknown (zero-day) vulnerability in Linux systems", "The lack of MFA on administrator accounts", "A weak encryption algorithm in public Wi-Fi networks"], "oa": ["ثغرات غير مرقّعة في أنظمة ويندوز", "ثغرة غير معروفة (zero-day) في أنظمة لينكس", "غياب MFA عن حسابات المسؤولين", "خوارزمية تشفير ضعيفة في شبكات Wi-Fi العامة"], "c": 0, "e": "الشريحة 9: «WannaCry exploited unpatched Windows».", "m": "WannaCry = ويندوز بلا تحديث.", "s": "Lec5 – شريحة 9", "open": false, "tf": false}, {"q": "ISO/IEC 27001 provides certification for an organization’s Information Security Management System (ISMS).", "qa": "يوفر ISO/IEC 27001 شهادة لنظام إدارة أمن المعلومات (ISMS) في المؤسسة.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "الشريحة 22 تذكر «ISO/IEC 27001 ISMS»؛ والاعتماد بالشهادة هو استخدامه المعروف (الشريحة لا تذكر كلمة certification صراحة).", "m": "27001 = شهادة ISMS.", "s": "Lec5 – شريحة 22", "open": false, "tf": true}, {"q": "A fundamental difference between Role-Based Access Control (RBAC) and the principle of Least Privilege is that:", "qa": "الفرق الجوهري بين التحكم بالوصول القائم على الأدوار (RBAC) ومبدأ أقل الصلاحيات أن:", "o": ["Least Privilege is a subset of RBAC", "They are identical concepts with different names", "RBAC is a technical implementation that can be used to enforce the policy of Least Privilege", "RBAC applies only to users, while Least Privilege applies only to systems"], "oa": ["أقل الصلاحيات جزء من RBAC", "هما مفهومان متطابقان باسمين مختلفين", "RBAC تنفيذ تقني يمكن استخدامه لتطبيق سياسة أقل الصلاحيات", "RBAC للمستخدمين فقط وأقل الصلاحيات للأنظمة فقط"], "c": 2, "e": "الشريحة 14: أقل الصلاحيات هو المبدأ، وRole-based access controls إحدى أدوات تطبيقه. (ملاحظة: الشريحة تسرد المفهومين دون مقارنة؛ العلاقة بينهما من المفهوم المعروف.)", "m": "Least Privilege = المبدأ · RBAC = الأداة.", "s": "Lec5 – شريحة 14", "open": false, "tf": false}, {"q": "Automating software updates for all systems without a testing phase is a recommended best practice to ensure the fastest deployment of security patches.", "qa": "أتمتة تحديثات البرمجيات لكل الأنظمة دون مرحلة اختبار ممارسة موصى بها لضمان أسرع نشر للتصحيحات الأمنية.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الشريحة 11: «Test updates in staging environments before wide rollout»؛ الأتمتة «حيثما أمكن» ولا تلغي الاختبار.", "m": "أتمت، لكن اختبر أولاً.", "s": "Lec5 – شريحة 11", "open": false, "tf": true}, {"q": "The NIST Cybersecurity Framework is a legally mandated requirement for all private companies in the United States.", "qa": "إطار NIST للأمن السيبراني متطلب قانوني إلزامي لكل الشركات الخاصة في الولايات المتحدة.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الشريحة 22 تعرضه ضمن «Frameworks & Standards» أي أُطر إرشادية للتبنّي، وليس إلزاماً قانونياً عاماً. (ملاحظة: الشريحة لا تذكر الإلزام القانوني صراحة، لكن الإطار طوعي كما هو معروف.)", "m": "إطار إرشادي لا قانون.", "s": "Lec5 – شريحة 22", "open": false, "tf": true}, {"q": "Network segmentation can help prevent a compromised point-of-sale system from being used to access the corporate human resources database.", "qa": "يمكن لتقسيم الشبكة أن يمنع استخدام نظام نقاط بيع مخترَق للوصول إلى قاعدة بيانات الموارد البشرية.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "التقسيم يحصر الوصول ويقيّد الحركة الجانبية (شريحة 15 و21). (ملاحظة: مثال نظام نقاط البيع غير مذكور في الشرائح؛ الجواب استنتاج من فكرة التقسيم.)", "m": "اختراق غرفة لا يفتح باقي الغرف.", "s": "Lec5 – شريحة 15, 21", "open": false, "tf": true}, {"q": "Least Privilege access control can help to limit the damage caused by a successful phishing attack on a standard user account.", "qa": "يمكن لأقل الصلاحيات أن يحد من الضرر الناتج عن نجاح هجوم تصيّد على حساب مستخدم عادي.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 0, "e": "الحساب المخترق لا يملك إلا الحد الأدنى من الصلاحيات (شريحة 14)، والتصيّد من التهديدات المذكورة في التدريب (شريحة 18). (ملاحظة: الجواب استنتاج من مبدأ أقل الصلاحيات والتدريب على التصيّد، والمثال نفسه غير مذكور.)", "m": "صلاحيات أقل = ضرر أقل.", "s": "Lec5 – شريحة 14, 18", "open": false, "tf": true}, {"q": "MFA implemented via SMS is considered more secure than using a dedicated authentication app because SMS is a older, more reliable technology.", "qa": "تُعد MFA عبر SMS أكثر أماناً من تطبيق مصادقة مخصص لأن SMS تقنية أقدم وأكثر موثوقية.", "o": ["True", "False"], "oa": ["صح", "خطأ"], "c": 1, "e": "الشريحة 8 توصي بتطبيقات المصادقة بدلاً من SMS؛ والقِدم لا يعني الأمان (SIM swapping).", "m": "SMS = الأضعف.", "s": "Lec5 – شريحة 8", "open": false, "tf": true}, {"q": "The NIST Cybersecurity Framework (CSF) is primarily used for:", "qa": "يُستخدم إطار NIST للأمن السيبراني (CSF) أساساً من أجل:", "o": ["Mandating the use of biometric authentication for all user accounts", "Providing a policy framework to help organizations manage and reduce cybersecurity risk", "Defining the encryption standards for data transmitted over the internet", "Prescribing specific brand-name security tools for an organization to purchase"], "oa": ["فرض البصمة الحيوية لكل الحسابات", "توفير إطار سياسات يساعد المؤسسات على إدارة المخاطر السيبرانية وتقليلها", "تحديد معايير التشفير للبيانات المنقولة عبر الإنترنت", "تحديد أدوات أمنية بعلامات تجارية بعينها للشراء"], "c": 1, "e": "NIST CSF أحد الأطر الموصوفة في شريحة 22 (مع CIS وISO 27001 وCOBIT) لتوجيه إدارة المخاطر.", "m": "CSF = إطار لإدارة المخاطر.", "s": "Lec5 – شريحة 22", "open": false, "tf": false}, {"q": "The recommendation to avoid \"frequent forced\" password changes is primarily because it can lead to:", "qa": "التوصية بتجنب التغيير الإجباري المتكرر لكلمات المرور سببها الأساسي أنه قد يؤدي إلى:", "o": ["Users writing down passwords insecurely", "Conflicts with the password history policy", "Increased helpdesk calls for password resets", "Users creating weaker, predictable password patterns (e.g., Password1, Password2)"], "oa": ["كتابة المستخدمين لكلمات المرور بطريقة غير آمنة", "تعارض مع سياسة سجل كلمات المرور", "زيادة مكالمات الدعم لإعادة التعيين", "إنشاء المستخدمين أنماطاً أضعف ويمكن توقعها (مثل Password1 ثم Password2)"], "c": 3, "e": "الشريحة 13: «Avoid frequent forced changes (can lead to weaker choices)».", "m": "تغيير إجباري = Password1، Password2.", "s": "Lec5 – شريحة 13", "open": false, "tf": false}, {"q": "Alignment between business and tech objectives can cause operational disruption.", "qa": "المواءمة بين أهداف الأعمال والأهداف التقنية قد تسبب تعطلاً تشغيلياً.", "o": [" ls that are invisible to users.", "Practice of working night shifts to enhance security monitoring."], "oa": ["استخدام الموظفين لتطبيقات أو أنظمة غير مصرّح بها", "تطبيق ضوابط أمنية غير مرئية للمستخدمين", "العمل بنوبات ليلية لتعزيز المراقبة الأمنية"], "c": 0, "e": "مذكورة ضمن فجوات السلوك: «Use of unauthorized apps (Shadow IT)». (الملف يعرض ثلاثة خيارات فقط.)", "m": "Shadow = خفي بلا إذن.", "s": "Lec4 – شريحة 19", "open": false, "tf": false}]};

  });
}
function all_(v){document.querySelectorAll('.card').forEach(c=>{c.classList.toggle('open',!!v);const b=c.querySelector('.tg');b.setAttribute('aria-expanded',!!v);b.textContent=v?'إخفاء الإجابة':'اضغط لإظهار الإجابة الصحيحة'})}
const tabs=document.getElementById('tabs');
Object.keys(DATA).forEach(k=>{const b=document.createElement('button');b.dataset.k=k;b.textContent=NAMES[k]+' ('+DATA[k].length+')';b.onclick=()=>render(k);tabs.appendChild(b)});
render('lec5');
</script>
